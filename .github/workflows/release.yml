name: release

# A vX.Y.Z tag: check the changelog, run CI, cross-compile the release
# binaries, then publish with notes from CHANGELOG.md and SHA256SUMS.txt.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: CHANGELOG.md and Cargo.toml carry this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^## \[$v\]" CHANGELOG.md
          grep -q "^version = \"$v\"" Cargo.toml

  ci:
    needs: changelog
    uses: ./.github/workflows/ci.yml

  build:
    needs: changelog
    strategy:
      matrix:
        include:
          - { os: windows-2022, target: x86_64-pc-windows-msvc,      asset: hash-bait-x86_64-pc-windows-msvc.zip,        exe: hash-bait.exe }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl,  asset: hash-bait-x86_64-unknown-linux-musl.tar.gz,  exe: hash-bait }
          - { os: macos-latest, target: aarch64-apple-darwin,       asset: hash-bait-aarch64-apple-darwin.tar.gz,       exe: hash-bait }
          - { os: macos-latest, target: x86_64-apple-darwin,        asset: hash-bait-x86_64-apple-darwin.tar.gz,        exe: hash-bait }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.asset }}" == *.zip ]]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" dist/
            (cd dist && 7z a "${{ matrix.asset }}" "${{ matrix.exe }}")
          else
            tar -czf "dist/${{ matrix.asset }}" -C "target/${{ matrix.target }}/release" "${{ matrix.exe }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: downloads-${{ matrix.target }}
          path: dist/*

  publish:
    needs: [ci, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: downloads-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk "/^## \[$v\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag --latest
